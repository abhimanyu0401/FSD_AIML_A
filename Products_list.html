<!DOCTYPE html>

    <script>
        async function getProducts() {
            try {
                const url = "https://dummyjson.com/products?limit=100";
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const data = await response.json();
                let row = "";
                data.products.map((i, index) => {
                    row += `<tr> 
                                <td> ${index + 1} </td>
                                <td> ${i.title} </td>
                                <td> <img src=${i.thumbnail} width="80"> </td>
                                <td> ${i.category} </td>
                                <td> ${formatNumber(i.price * rte)}₹ </td>
                                <td> ${i.rating} </td>
                                <td> ${i.stock} </td>
                                </tr>`;
                })
                ele.innerHTML = row;
            } catch (error) {
                console.log("Error : ", error);
                ele.innerHTML = `<tr> 
                    <td colspan="7" style="text-align: center; color: red;">Failed to load products. Please try again later.</td>
                    </tr>`;
            }
        }

        function formatNumber(num) {
            if (num >= 1000) {
                return num.toLocaleString("en-US", { maximumFractionDigits: 2 });
