<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #cont {
            display: flex;
            flex-direction: column;

        }

        body {
            background-color:#24292F;
            color: aliceblue;
        }
        header{
            text-align: center;
            background-color: black
        }
    </style>
</head>

<body>
    <header>
        <h1>GitHub Page Info </h1>
    </header>
    <div id="cont"></div>
    <script>
        async function loadUserData(username) {
            try {
                const url = `https://api.github.com/users/${username}`;
                const response = await fetch(url);
                const data = await response.json();
                const ele = document.getElementById("cont");
                ele.innerHTML += `<p>Name : ${data.name}</p>`;
                ele.innerHTML += `<p>Avatar : <img src =${data.avatar_url} width="50"> </p>`;
                ele.innerHTML += `<p>Number of repos : ${data.public_repos}</p>`
                console.log("Response = ", response.json());

            }
            catch (err) {
                console.log("Error : ", err);

            }
        }
        loadUserData("abhimanyu0401");
    </script>
</body>

</html>
